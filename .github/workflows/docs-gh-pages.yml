name: Publish Docs

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      # The theme override emits the title, the social card and the structured
      # data. A change confined to it changes every published page, so leaving
      # it out of this list would let that change sit unpublished until some
      # unrelated edit under docs/ happened to carry it along.
      - overrides/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs-gh-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Build docs
        run: mkdocs build --strict

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          cname: 3270Web.3270.io
          force_orphan: true