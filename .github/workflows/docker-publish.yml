name: Build and publish Docker image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The job's own GITHUB_TOKEN, not a personal access token. A PAT is a
      # credential that expires, and when it did this step began failing with
      # "denied: denied" before the build ever started — so main carried on
      # merging while the published image quietly stopped being updated.
      # GITHUB_TOKEN cannot expire, and `packages: write` above is what it
      # needs. 3270Connect publishes to the same organisation this way.
      #
      # If this ever returns 403 rather than logging in, the package is not
      # linked to this repository: open the package's settings on GHCR →
      # Manage Actions access → add this repository with the write role. The
      # org.opencontainers.image.source label in the Dockerfile is what makes
      # GitHub link them in the first place.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/3270io/3270web
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/3270io/3270web:buildcache
          cache-to: type=registry,ref=ghcr.io/3270io/3270web:buildcache,mode=max
