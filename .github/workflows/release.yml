name: Release

# Builds the release binaries on a tag, signs the Windows executable, and
# attaches everything to a draft GitHub release.
#
# Signing is opt-in and off until the infrastructure exists for it. Certum's
# Code Signing in the Cloud has no signing API: the key lives in Certum's HSM
# but the only way to reach it is SimplySign Desktop, which emulates a smart
# card reader on a logged-in Windows desktop and holds that session for two
# hours at a time. A GitHub-hosted runner is a fresh VM with no session, so it
# cannot sign no matter what secrets it is given.
#
# Until a Windows machine is registered as a self-hosted runner, this workflow
# does everything except sign: it produces a draft release with unsigned
# binaries, which are signed by hand and re-uploaded before publishing. Set the
# repository variable WINDOWS_SIGNING to `enabled` to turn the signing job on.
# See .github/RELEASE_SIGNING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Upload unsigned executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: 3270Web.exe
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        # Both architectures the published Docker image supports.
        run: |
          ./scripts/build-linux.sh 3270Web_linux_amd64
          GOARCH=arm64 ./scripts/build-linux.sh 3270Web_linux_arm64

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            3270Web_linux_amd64
            3270Web_linux_arm64
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign Windows executable
    needs: build-windows
    # Requires a self-hosted Windows runner with SimplySign Desktop installed
    # and logged in. The `signing` label keeps release signing off the existing
    # Linux self-hosted runner used by docker-publish.yml.
    runs-on: [self-hosted, windows, signing]
    if: vars.WINDOWS_SIGNING == 'enabled'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unsigned executable
        uses: actions/download-artifact@v4
        with:
          name: windows-unsigned

      - name: Sign
        shell: pwsh
        env:
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
        run: ./scripts/sign-windows.ps1 -Path 3270Web.exe

      - name: Upload signed executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: 3270Web.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: [build-windows, build-linux, sign]
    # `always()` lets this run when `sign` is skipped, but a signing job that
    # actually failed must not fall through to publishing unsigned binaries —
    # that would silently undo the whole point of the release being signed.
    if: |
      always()
      && needs.build-windows.result == 'success'
      && needs.build-linux.result == 'success'
      && needs.sign.result != 'failure'
      && needs.sign.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.sign.result == 'success' && 'windows-signed' || 'windows-unsigned' }}
          path: dist

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum 3270Web.exe 3270Web_linux_amd64 3270Web_linux_arm64 > SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('untagged-{0}', github.sha) }}
          SIGNED: ${{ needs.sign.result == 'success' }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            note="The Windows executable is Authenticode-signed and timestamped."
          else
            note="**The Windows executable is not signed.** Sign \`3270Web.exe\` locally, replace the asset, regenerate \`SHA256SUMS.txt\`, then publish."
          fi

          cat > notes.md <<EOF
          ## 3270Web $TAG

          $note

          Verify a download against \`SHA256SUMS.txt\`:

          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          EOF

          # Re-running a release must not fail on an existing draft, and must
          # not append a second copy of each asset to it either. Once a release
          # is published its assets are what people have already downloaded and
          # checksummed, so replacing them silently would be worse than failing
          # — a re-run at that point is a mistake, not an update.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to replace its assets."
              exit 1
            fi
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --draft \
              --title "$TAG" \
              --notes-file notes.md
          fi
