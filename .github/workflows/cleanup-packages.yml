name: Cleanup Old Container Images

# docker-publish.yml builds and pushes the 3270web image for two platforms
# (linux/amd64, linux/arm64) on every push to main, tagged via
# docker/metadata-action (latest + sha). Multi-platform builds are the
# classic source of orphaned, untagged per-architecture manifests in GHCR,
# on top of the usual buildx cache layers — those accumulate forever unless
# pruned. This workflow deletes untagged versions on a schedule, keeping a
# small buffer of the most recent ones so a just-superseded digest can still
# be rolled back to.
#
# Tagged versions (latest, sha-*) are NEVER deleted — the cleanup is
# restricted to untagged versions only.

on:
  schedule:
    - cron: "47 2 * * *" # daily at 02:47 UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [3270web]
    steps:
      - name: Delete untagged versions of ${{ matrix.package }}
        # v5 is the newest major, and it still runs on Node 20 — the only
        # action in this repository that does. Every other one was moved to a
        # Node 24 major; there is nothing to move this one to. When Node 20
        # leaves the runners this step stops working and the untagged versions
        # start accumulating again, silently, because a scheduled workflow has
        # nobody watching it. Either a Node 24 major appears upstream before
        # then, or this becomes a `gh api` call in a run step.
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: 10
          # The default token, matching docker-publish.yml, which no longer
          # uses a PAT. Both steps now depend on the package being linked to
          # this repository; if this reports "Package not found" or a 403,
          # that link is what is missing — package settings on GHCR → Manage
          # Actions access → add this repository with the admin role.
          token: ${{ secrets.GITHUB_TOKEN }}
