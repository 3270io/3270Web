<!DOCTYPE html>
<html>
<head>
    <title>3270Web - Error</title>
    <link rel="icon" type="image/png" href="/static/3270Web_logo.png">
    <link rel="apple-touch-icon" href="/static/3270Web_logo.png">
    <link rel="stylesheet" type="text/css" href="/static/style.css">
    <script src="/static/theme.js" defer></script>
</head>
<body>
    <script>
        (function () {
            try {
                var themeAliases = { "theme-minimal": "theme-dark", "theme-not3270": "theme-light", "theme-custom": "theme-yorkshire" };
                var builtInThemes = {
                    "theme-yorkshire": true,
                    "theme-authentic": true,
                    "theme-classic": true,
                    "theme-dark": true,
                    "theme-light": true,
                    "theme-modern": true,
                    "theme-slick": true
                };
                var themeId = localStorage.getItem("3270Web.theme") || localStorage.getItem("3270Web.defaultTheme") || "theme-yorkshire";
                themeId = themeAliases[themeId] || themeId;
                if (themeId.indexOf("theme-file:") === 0) {
                    document.body.classList.add("theme-custom");
                    return;
                }
                document.body.classList.add(builtInThemes[themeId] ? themeId : "theme-yorkshire");
            } catch (err) {
                document.body.classList.add("theme-yorkshire");
            }
        })();
    </script>
    <div class="bg-overlay" data-bg-toggle title="Click to toggle background animation" role="button" tabindex="0" aria-pressed="true" aria-label="Toggle background animation">
        <canvas id="bg-canvas" aria-hidden="true"></canvas>
    </div>
    <div class="error-page">
        <h1 class="error-title">Error</h1>
        <p>{{ .Error }}</p>
        <form action="/disconnect" method="post">
            <button type="submit">Back to Connect</button>
        </form>
    </div>
    <script src="/static/background.js" defer></script>
</body>
</html>
