<!DOCTYPE html>
<html>
<head>
    <title>3270Web - Change password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/static/favicon-32.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="stylesheet" type="text/css" href="/static/style.css">
    <script src="/static/theme.js?v=8" defer></script>
</head>
<body>
    <script src="/static/early-theme-init.js"></script>
    <div class="bg-overlay" data-bg-toggle title="Click to toggle background animation" role="button" tabindex="0" aria-pressed="true" aria-label="Toggle background animation">
        <canvas id="bg-canvas" aria-hidden="true"></canvas>
    </div>
    <div class="error-page">
        <div class="error-card">
            <h1 class="error-title">Choose a new password</h1>

            {{ if .Forced }}
            <p class="login-note">
                Your password was issued by the server. Choose your own before
                continuing.
            </p>
            {{ end }}

            {{ if .Error }}
            <p class="error-message" role="alert" aria-live="assertive">{{ .Error }}</p>
            {{ end }}

            <form action="/account/password" method="post" class="login-form" autocomplete="on">
                <label for="currentPassword">Current password</label>
                <input type="password" id="currentPassword" name="currentPassword"
                       autocomplete="current-password" required autofocus>

                <label for="newPassword">New password</label>
                <input type="password" id="newPassword" name="newPassword"
                       autocomplete="new-password" minlength="{{ .MinLength }}" required>

                <label for="confirmPassword">Confirm new password</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       autocomplete="new-password" minlength="{{ .MinLength }}" required>

                <button type="submit">Change password</button>
            </form>

            <p class="login-note">
                At least {{ .MinLength }} characters. Changing your password signs
                out your other sessions.
            </p>
        </div>
    </div>
    <script src="/static/background.js" defer></script>
</body>
</html>
