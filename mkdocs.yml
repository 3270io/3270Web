site_name: 3270Web
# Doubles as the fallback <meta name="description"> and the og:description on
# any page without its own `description:` front matter, so it is written as a
# sentence a search result can show rather than a shelf label.
site_description: >-
  Browser-based IBM 3270 terminal emulation: connect to any TN3270 host with no
  emulator install, then record sessions, explore with AI Chat and replay them.
site_author: 3270.io
copyright: "(c) Since 2023 3270.io"
# Lower-case: GitHub Pages serves this host in lower case, and the canonical
# URL Material builds from it has to match the address readers actually land on.
site_url: https://3270web.3270.io
repo_url: https://github.com/3270io/3270Web
repo_name: GitHub
edit_uri: edit/main/docs/
site_dir: site
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  language: en
  # No `logo:` key on purpose. Material renders that as <img>, which is its own
  # document and so cannot read the palette tokens. overrides/partials/logo.html
  # inlines the mark instead, so it re-tints with GRN/AMB/ICE/DAY.
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.expand
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
    - toc.integrate
    - content.tabs.link
    - content.footnotes
  # Colour is owned by docs/stylesheets/3270-theme.css, which ships the same
  # four palettes as 3270.io and the 3270Connect console (phosphor / amber /
  # ice / daylight). The GRN·AMB·ICE·DAY switch in the header replaces
  # Material's two-scheme toggle.
  #
  # `3270` is a deliberately unknown scheme name: Material ships no variable
  # block for it, so nothing competes with ours. (Material renders the scheme
  # onto <body>, where its own slate/default blocks would otherwise outrank
  # the html-level tokens by inheritance.) `custom` does the same for
  # primary/accent.
  palette:
    scheme: '3270'
    primary: custom
    accent: custom
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Home: index.md
  - Install and Run: installation.md
  - Connect and Use 3270Web: configuration.md
  - Bundled Sample Applications: sample-apps.md
  - User Accounts and Sign-In: authentication.md
  - Running a Shared Instance: multi-user.md
  - The Session Manager: session-manager.md
  - Recordings and Playback: workflow.md
  - Guided Business Tasks: business-tasks.md
  - Chaos Mode: chaos-mode.md
  - Chaos Mind-Map Compare: chaos-compare.md
  - Host Compatibility Profiler: host-profiler.md
  - Compatibility Profile Schema: compatibility-profile-schema.md
  - Terminal Fonts: terminal-fonts.md
  - AI Chat Mode: ai-chat.md
  - AI Providers: ai-providers.md
  - Keyboard and Controls: keyboard-and-controls.md
  - Screen Size and Model Guide: terminal-model-limits.md
  - REST API: rest-api.md
  - Embedding 3270Web: embedding.md
  - MCP Server: mcp.md
  - Skills and Extensions: skills.md
  - Terminal Capabilities: terminal-capabilities.md
  - Accessibility: accessibility.md
  - Feature Roadmap: feature-roadmap.md
  - Acknowledgements: acknowledgements.md

plugins:
  - search
  - mkdocs-video:
      is_video: true
      video_autoplay: false
  - tags:
      enabled: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - footnotes

extra_css:
  # Shared 3270.io design system — keep first so extra.css can layer on it.
  - stylesheets/3270-theme.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/3270-theme.js

extra:
  version: 1.8.6
  CNAME: 3270.io
  generator: false
  # Short enough to sit next to the product name in a social card title, where
  # site_description would be cut off. overrides/main.html uses it for the home
  # page's og:title and for the preview image's alt text.
  tagline: the mainframe in a browser tab
  social:
    # Sibling sites first, so every page in the suite offers the same way back
    # out to 3270.io and across to the other tool's guide.
    - icon: material/home-variant
      link: https://3270.io
      name: 3270.io
    - icon: material/console-line
      link: https://3270connect.3270.io
      name: 3270Connect documentation
    - icon: fontawesome/brands/github
      link: https://github.com/3270io
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/company/3270io
    - icon: fontawesome/brands/twitter
      link: https://x.com/3270io
